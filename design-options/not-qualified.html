<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Application Received — Remote Sales Academy</title>
    <link rel="stylesheet" href="shared.css?v=4" />
    <style>
      .decision-page { min-height: calc(100dvh - 58px); padding: 72px 20px; display: grid; place-items: center; }
      .decision-page__inner { width: min(100%, 680px); }
      .decision-page h1 { margin: 0; font: 600 clamp(38px, 6vw, 62px)/1 'Bricolage Grotesque', sans-serif; letter-spacing: -.04em; }
      .decision-page p { max-width: 590px; margin: 22px 0 0; color: var(--muted); font: 400 16px/1.7 'Manrope', sans-serif; }
      .decision-page__actions { margin-top: 34px; padding-top: 28px; display: flex; align-items: center; gap: 20px; border-top: 1px solid var(--line); }
      .decision-page__actions .cta { min-width: 220px; }
      @media (max-width: 620px) {
        .decision-page { padding: 48px 18px; place-items: start center; }
        .decision-page__actions { display: grid; }
        .decision-page__actions .cta { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="/">REMOTE SALES <b>ACADEMY</b></a>
      </div>
    </header>
    <main class="decision-page">
      <div class="decision-page__inner">
        <h1>Your application has been received.</h1>
        <p>Based on your answers, an application call is not the right next step yet. Keep learning from the free training and follow Remote Sales Academy for practical sales breakdowns and student updates.</p>
        <div class="decision-page__actions">
          <a class="cta" href="https://www.instagram.com/stories/highlights/18040208225396466/" target="_blank" rel="noreferrer">View Student Wins</a>
          <a class="back-link" href="/">Return to the training</a>
        </div>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 14px/1.6 var(--font-sans); color: var(--foreground); margin: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button { font: 600 13px var(--font-sans); padding: 7px 14px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--muted-foreground); }
  .tabs button.on { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  h2 { font-size: 19px; margin: 0; }
  .meta { color: var(--muted-foreground); font-size: 13px; margin: 2px 0 14px; }
  .overlay { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
  .overlay small { display: block; color: var(--muted-foreground); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .overlay b { font-size: 16px; }
  .sec { display: grid; grid-template-columns: 110px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
  .lab { font: 600 11px var(--font-sans); text-transform: uppercase; letter-spacing: .08em; padding-top: 3px; }
  .sec p { margin: 0; font-size: 15px; }
  .note { color: var(--muted-foreground); font-size: 12px; margin-top: 6px; }
  .rec { color: var(--muted-foreground); font-size: 13px; }
  ul.gen { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
  .c1 { color: var(--chart-1); } .c2 { color: var(--chart-2); } .c3 { color: var(--chart-3); } .c4 { color: var(--chart-4); } .c5 { color: var(--chart-5); } .c6 { color: var(--accent); } .c0 { color: var(--muted-foreground); }
</style></head><body>
<div class="tabs" id="tabs"></div>
<div id="ad"></div>
<script>
const D = {"ads": [{"n": 1, "t": "Not a Course", "focus": "Salespeople who already paid for a course", "overlay": "Paid for the course. Still no role.", "s": ["If you've already paid for a closing course and you still don't have a role, this is for you.", "Listen. It's not your skill. The problem is getting in front of the companies that are actually hiring.", "You did the training. You've sent the Looms, filled in the applications, messaged the offer owners. But every role gets posted in the same few places, hundreds of people apply, and you're one name in the pile. So you hear nothing back, and you start wondering if you wasted the money.", "I know, because I've been there. I drained my savings on a course, then spent two years sending Looms to fifty companies a day before anyone hired me. Now I work directly with the companies that hire closers, not just to place myself, but to place you too. Zane came to me after another mentor never placed him. I placed him, and he's now making nine thousand dollars a month.", "Another course won't fix this. What gets you hired is someone who puts you straight in front of those companies. That's what I do. And if a role doesn't work out, I put you in the next one.", "If you can sell and you're willing to be coached, you could be on your first calls by next week. Click below and I'll show you exactly how."], "alts": ["I'm not going to sell you a sales course. I'm going to tell you why most of them don't get you hired.", "If you're in sales and thinking about going remote, don't buy another course."], "notes": "Film this one first, in a plain room with no props. Slow down on \"I know, because I've been there.\" B-roll on the Zane line: a 3-second clip from his testimonial.", "words": 224, "secs": 80}, {"n": 2, "t": "The Cap", "focus": "Salespeople on capped commission", "overlay": "Sales job. Capped commission.", "s": ["If you're in a sales job and your commission is capped, this is for you.", "Listen. You're not underperforming. You're capped. And no amount of extra effort fixes a cap.", "Close ten or close twenty, past a certain point the company keeps the difference. The only way up is a promotion that depends on who you know, or a pay rise that barely moves. So you push harder every quarter, and your payslip doesn't notice.", "I know that feeling. I was working hard and completely capped, until I moved into remote high-ticket sales. Now I work directly with the companies that hire closers, not just to place myself, but to place you too. Jason was an insurance broker doing sixty-hour weeks. His best month since was around six thousand seven hundred in commission.", "You already do the hard part: building rapport, handling objections, getting someone to a decision. In remote high-ticket sales, you do the same thing on Zoom and get paid on what you close. What you need is someone who puts you in front of those companies. That's what I do. And if a role doesn't work out, I put you in the next one.", "If you can sell and you're willing to be coached, you could be on your first calls by next week. Click below and I'll show you exactly how."], "alts": ["Hit target. Same pay as last month.", "If your commission is capped no matter how well you sell, this is for you."], "notes": "Deliver it calm and a bit dry. The viewer should think \"that's literally my job\". Hit \"You're capped.\" hard and pause after it. Optional B-roll: a blurred commission-plan PDF or a payslip.", "words": 225, "secs": 80}, {"n": 3, "t": "The Week Off", "focus": "Salespeople who can't get time off", "overlay": "Sales job. Still asking for days off.", "s": ["If you're in a sales job and you still have to ask a manager for your own time off, this is for you.", "Listen. You can be the best closer on the team and still not own a single day of your calendar.", "Holiday forms three months ahead. Fighting three people for the same week in August. Missing things that matter because the rota said no. You hit your numbers, and you still need permission to live your life.", "I know, because I once asked for my own birthday off and got told no. My student Jason was an insurance broker. He asked for time off to see family he hadn't seen in nearly twenty years. Same answer. His best month since joining was around six thousand seven hundred in commission. He's left the job, and he books his own trips now.", "In remote high-ticket sales, you're paid on what you close, and you take your calls from wherever your laptop is. What you need is someone who puts you in front of the companies that are hiring. That's what I do. And if a role doesn't work out, I put you in the next one.", "If you can sell and you're willing to be coached, you could be on your first calls by next week. Click below and I'll show you exactly how."], "alts": ["My student asked for time off to see family he hadn't seen in twenty years. They said no.", "Still filling in a holiday request form to use your own time?"], "notes": "Tell the birthday line like a quick memory, not a complaint. B-roll: Jason's testimonial and the travel shots.", "words": 224, "secs": 80}, {"n": 4, "t": "The Cold Call", "focus": "Setters and SDRs", "overlay": "Setter or SDR? Still cold calling?", "s": ["If you're a setter or an SDR cold calling all day, this is for you.", "Listen. You're already doing the hardest calls in sales. You're just not the one getting paid for the close.", "Hundreds of dials. Hang-ups. Angry people. Time wasters. You finally book the call, someone else closes it, and they take the commission. And on a good month you're on two grand.", "My student James was exactly there. An appointment setter, cold calling all day, about two grand on a good month. I placed him on a high-ticket offer with a company I work with, and in his second month he made six thousand seven hundred dollars.", "In high-ticket closing, it flips. The people on your calendar have watched a video, filled in an application and asked to talk. Your job isn't to convince them. It's to find out if you can help. I work directly with the companies that hire closers, and I put you straight in front of them. If a role doesn't work out, I put you in the next one.", "If you can sell and you're willing to be coached, you could be on your first calls by next week. Click below and I'll show you exactly how."], "alts": ["If you're a setter or an SDR, you're one step away from the role that actually pays.", "You already book the calls. Why is someone else closing them?"], "notes": "Open with energy on the pain list, then slow down on \"it flips\". B-roll: James's testimonial.", "words": 205, "secs": 75}, {"n": 5, "t": "The Sales Floor", "focus": "Car sales and floor sales", "overlay": "Car sales? Still waiting on walk-ins?", "s": ["If you sell cars and you're tired of standing on the lot waiting for walk-ins, this is for you.", "Listen. You already do the hardest part of selling. You take someone who isn't sure and help them make a decision. The problem is everything around it.", "Saturdays on the lot. Walk-ins that don't come. The manager taking over at the desk. Splitting the deal you did all the work on. And on the first of the month it resets to zero, like nothing you did counted.", "I work directly with the companies that hire closers, not just to place myself, but to place you too. Zane came from a sales job paying fifteen hundred a month. I placed him, and he's now making nine thousand dollars a month.", "Remote high-ticket sales uses the exact same skill. But the leads come to you, booked in and already interested, and you take the call from wherever your laptop is. What you need is someone who puts you in front of those companies. That's what I do. And if a role doesn't work out, I put you in the next one.", "If you can sell and you're willing to be coached, you could be on your first calls by next week. Click below and I'll show you exactly how."], "alts": ["If you sell cars, you already know how to do the hardest part of this job.", "If you sell on a showroom floor, your skill is worth more than your commission plan says."], "notes": "Keep the pain list quick, one beat per line. Pause after \"like nothing you did counted.\" B-roll on the Zane line: a clip from his testimonial.", "words": 216, "secs": 80}, {"n": 6, "t": "Sunday Night", "focus": "Corporate and finance sales", "overlay": "Corporate sales. Dreading Monday already?", "s": ["If you're in corporate or finance sales and you're already dreading Monday by Sunday night, this is for you.", "Listen. It's not selling you hate. It's everything wrapped around it.", "The commute. The hour-long update that could've been two lines. A manager listening in on your calls. Targets that reset on the first of every month, like nothing you did counted. And by Sunday night, you can already feel Monday coming.", "I know that feeling. Grey sky, packed train, same desk, completely capped. Now I work directly with the companies that hire closers, not just to place myself, but to place you too. Zane came from a fifteen-hundred-dollar-a-month sales job. James was cold calling for two grand. Jason was an insurance broker. All three now close remotely.", "Companies selling high-ticket programmes need people who can close over Zoom. But when those roles get posted, hundreds of people apply. What you need is someone who puts you straight in front of those companies. That's what I do. And if a role doesn't work out, I put you in the next one.", "If you can sell and you're willing to be coached, you could be on your first calls by next week. Click below and I'll show you exactly how."], "alts": ["If your week is pipeline meetings, a two-hour commute and a target that resets every month, this is for you.", "Monday's pipeline meeting, the commute, the manager on your calls. You know the week."], "notes": "Film at night with warm lamp light to match the Sunday-night mood. Speed up a little on the pain list. B-roll: one second from each of the three testimonials during the proof line.", "words": 208, "secs": 75}], "gen": ["<b>Setup:</b> phone vertical (9:16) at eye level, window light on Mike's face, quiet room, clip-on mic. Keep the head and shoulders inside a 4:5 crop too.", "<b>First 3 seconds:</b> start on the callout, straight to the lens. No \"hey guys\" and no intro. The on-screen text shows over those first 3 seconds.", "<b>Don't read it word for word.</b> Learn the beats and say it naturally. Keep these exact: the numbers, \"If a role doesn't work out, I put you in the next one\", and the CTA.", "<b>Hooks:</b> film each script's 3 hooks back to back, then the body once. The editor joins them, so we get 3 ads per script.", "<b>Tone:</b> calm and direct, like talking to one person. Pause after the hook and after the pain line.", "<b>Captions:</b> burned in, big, one line at a time.", "<b>Never say:</b> guarantee, guaranteed job, get rich, passive income, uncapped, or anything about the viewer's money (\"broke\", \"can't pay rent\")."]};
const LAB = [["Callout","c1"],["The point","c2"],["Pain points","c3"],["Authority","c6"],["The turn","c4"],["CTA","c5"]];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
let cur = 0; const N = D.ads.length + 1;
function draw(){
  tabs.innerHTML = D.ads.map((a,i)=>`<button class="${i===cur?'on':''}" data-i="${i}">${a.n} · ${esc(a.t)}</button>`).join("")
    + `<button class="${cur===D.ads.length?'on':''}" data-i="${D.ads.length}">Filming notes</button>`;
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw();});
  if (cur===D.ads.length){ ad.innerHTML = `<h2>Filming notes · all ads</h2><div class="meta">For Mike, before he records</div><ul class="gen">${D.gen.map(g=>`<li>${g}</li>`).join("")}</ul>`; return; }
  const a = D.ads[cur];
  ad.innerHTML = `<h2>Ad ${a.n} · ${esc(a.t)}</h2>
    <div class="meta">${esc(a.focus)} · about ${a.words} words · about ${a.secs}s · Mike, to camera</div>
    <div class="overlay"><small>On-screen text, first 3 seconds</small><b>${esc(a.overlay)}</b></div>`
    + a.s.map((p,i)=>`<div class="sec"><div class="lab ${LAB[i][1]}">${LAB[i][0]}</div><div><p>${esc(p)}</p>${i===0?a.alts.map(x=>`<div class="note">Alt: "${esc(x)}"</div>`).join(""):""}</div></div>`).join("")
    + `<div class="sec"><div class="lab c0">Recording</div><p class="rec">${esc(a.notes)}</p></div>`;
}
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){cur=(cur+1)%N;draw();} if(e.key==="ArrowLeft"){cur=(cur-1+N)%N;draw();} });
draw();
</script>
</body></html>
